name: Reusable verification

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      full:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - id: matrix
        env:
          FULL: ${{ inputs.full }}
        run: |
          node <<'JS' >> "$GITHUB_OUTPUT"
          const include = [
            {name: 'macOS 26 · native Liquid Glass', os: 'macos-26', node: '24', rust: 'stable'},
          ];
          if (process.env.FULL === 'true') include.push(
            {name: 'macOS 14 · minimum toolchain · embedded only', os: 'macos-14', node: '22.16.0', rust: '1.88.0'},
            {name: 'macOS 15 · desktop popout', os: 'macos-15', node: '24', rust: 'stable'},
          );
          console.log(`value=${JSON.stringify({include})}`);
          JS
  compatibility:
    needs: plan
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Install locked dependencies
        run: npm ci

      - name: Install browser runtime
        run: npx playwright install chromium

      - name: Verify source, Rust, web, lifecycle, and compatibility gates
        run: npm run verify

      - name: Verify embedded SVG Liquid Glass
        run: npm run test:glass

      - name: Preserve failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-reports-${{ matrix.os }}
          path: target/reports/
          if-no-files-found: ignore
          retention-days: 7
